<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>9122hacks</title>
                <style>
                        * { margin: 0; padding: 0; box-sizing: border-box; }
                                body {
                                            background-color: #0d0d0d;
                                                        color: #ffffff;
                                                                    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
                                                                                display: flex;
                                                                                            justify-content: center;
                                                                                                        align-items: center;
                                                                                                                    height: 100vh;
                                                                                                                                overflow: hidden;
                                                                                                                                        }
                                                                                                                                                .container {
                                                                                                                                                            display: flex;
                                                                                                                                                                        flex-direction: column;
                                                                                                                                                                                    align-items: center;
                                                                                                                                                                                                text-align: center;
                                                                                                                                                                                                            padding: 20px;
                                                                                                                                                                                                                        width: 100%;
                                                                                                                                                                                                                                    max-width: 100vw; /* Строго ограничиваем контейнер по ширине */
                                                                                                                                                                                                                                            }
                                                                                                                                                                                                                                                    .text-main {
                                                                                                                                                                                                                                                                font-size: clamp(32px, 8vw, 90px); /* Текст плавно растет, но не станет меньше 32px и больше 90px */
                                                                                                                                                                                                                                                                            font-weight: bold;
                                                                                                                                                                                                                                                                                        word-wrap: break-word; /* Если не влезает, текст безопасно перенесется */
                                                                                                                                                                                                                                                                                                    width: 100%;
                                                                                                                                                                                                                                                                                                                margin-bottom: 10px;
                                                                                                                                                                                                                                                                                                                        }
                                                                                                                                                                                                                                                                                                                                .text-sub {
                                                                                                                                                                                                                                                                                                                                            font-size: clamp(14px, 3vw, 32px); /* Суб-текст не станет меньше 14px и больше 32px */
                                                                                                                                                                                                                                                                                                                                                        font-weight: normal;
                                                                                                                                                                                                                                                                                                                                                                    opacity: 0.4;
                                                                                                                                                                                                                                                                                                                                                                                word-wrap: break-word; /* Защита от вылезания длинной строки за края */
                                                                                                                                                                                                                                                                                                                                                                                            width: 100%;
                                                                                                                                                                                                                                                                                                                                                                                                    }
                                                                                                                                                                                                                                                                                                                                                                                                        </style>
                                                                                                                                                                                                                                                                                                                                                                                                        </head>
                                                                                                                                                                                                                                                                                                                                                                                                        <body>
                                                                                                                                                                                                                                                                                                                                                                                                            <div class="container">
                                                                                                                                                                                                                                                                                                                                                                                                                    <div class="text-main">@nineonetwotwo</div>
                                                                                                                                                                                                                                                                                                                                                                                                                            <div class="text-sub">@z9122, @r_drawothermodels</div>
                                                                                                                                                                                                                                                                                                                                                                                                                                </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                </body>
                                                                                                                                                                                                                                                                                                                                                                                                                                </html>
